# Optional observability stack. Joins the running harness backend network.
# Usage: docker compose -p harness-monitoring -f compose.monitoring.yaml up -d
name: harness-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    networks: [backend]
    depends_on: [prometheus]

volumes:
  promdata: {}
  grafanadata: {}

networks:
  backend:
    name: harness-local-dev_backend
    external: true
