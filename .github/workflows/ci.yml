name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline tests
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: .:./common:./services/worker

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/portal/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/portal
      - name: Unit tests
        run: pnpm run test
        working-directory: apps/portal
      - name: Build
        run: pnpm run build
        working-directory: apps/portal

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          set -e
          BAD=0
          for f in $(git ls-files); do
            case "$f" in
              *.png|*.jpg|*.pdf|*.zip|*.dump|*.lock|apps/portal/dist/*|apps/portal/node_modules/*) continue ;;
            esac
            [ -f "$f" ] || continue
            if grep -qE 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$f"; then
              echo "possible secret in $f"; BAD=1
            fi
          done
          if git ls-files | grep -qE '(^|/)\.env\.local$|^secrets/'; then
            echo 'sensitive local file tracked'; BAD=1
          fi
          test "$BAD" -eq 0
