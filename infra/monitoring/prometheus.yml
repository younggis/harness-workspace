global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: harness-api
    static_configs:
      - targets: ["harness-local-dev-api-1:8000"]
  - job_name: harness-llm
    static_configs:
      - targets: ["harness-local-dev-llm-1:8090"]
