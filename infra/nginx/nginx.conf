# Portal host: static Vue build + /api control plane.
server {
    listen 8080;
    server_name portal.localhost localhost 127.0.0.1 _;
    root /usr/share/nginx/portal;
    index index.html;
    client_max_body_size 130m;
    proxy_buffering off;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Request-ID $request_id;
    }
    location /health/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /scim/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /metrics {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Workspace host: everything goes to the API gateway (which signs to relay).
server {
    listen 8080;
    server_name ~^w-;
    client_max_body_size 130m;
    proxy_buffering off;

    # Trusted platform UI + assets on the workspace host.
    location = /index.html {
        root /usr/share/nginx/portal;
    }
    location /_platform/ui/ {
        root /usr/share/nginx/portal;
        try_files $uri /index.html;
    }
    # Portal UI assets use a relative base (./assets/...) under /_platform/ui/.
    # dsh's own /assets/... must fall through to the API gateway and runtime.
    location /_platform/ui/assets/ {
        alias /usr/share/nginx/portal/assets/;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 3600s;
    }
}
