# Locked profile patch for dsh @ 0.2.2-rc.4 (see upstream.lock.json).
# Registers exactly one route: the workspace-scoped model proxy. The runtime
# injects a short-lived HARNESS_MODEL_TOKEN; the supplier key stays in the llm service.
- id: llm-pi-ai
  config:
    providers:
      harness:
        displayName: DeepSeek (workspace proxy)
        api: openai-completions
        baseURL: http://model-proxy:8090/v1
        apiKeyEnv: HARNESS_MODEL_TOKEN
        models:
          - id: deepseek-flash
            name: deepseek-flash
            contextWindow: 200000
            maxTokens: 8192
            input: [text]
- id: agent-default-model
  config:
    provider: harness
    model: deepseek-flash
